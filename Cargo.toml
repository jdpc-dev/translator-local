[package]
name = "translator-local"
version = "0.2.13"
edition = "2024"
rust-version = "1.88"
description = "Offline, rule-based English-Spanish command-line translator"
license = "GPL-3.0-only"
repository = "https://github.com/jdpc-dev/translator-local"
readme = "README.md"

[[bin]]
name = "translate-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
